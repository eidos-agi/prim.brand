name: Brand contract conformance
on:
  push:
    branches: [main, feat/brand-contract-v0.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brand-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-v02.txt -r requirements-export-v02.txt
      - name: Conformance, negative cases, legacy compatibility and migration
        run: python scripts/ci_verify.py
      - name: Keep original legacy kits and validator unchanged
        run: git diff --exit-code -- packs scripts/validate.py
  materialize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/brand-contract-v0.2'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/brand-contract-v0.2
      - name: Verify branch has not advanced
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-v02.txt -r requirements-export-v02.txt
      - run: python scripts/ci_verify.py
      - name: Save schemas, synthetic examples and verified evidence
        run: |
          git add schemas examples reports
          if ! git diff --cached --quiet; then
            git config user.name 'Brand contract builder'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: materialize verified brand schemas, examples and evidence'
            git push origin HEAD:feat/brand-contract-v0.2
          fi
